# Workspace -> tab -> agent layout; merge these sections into Herdr config.toml.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "$ihs_group", bold = true, dim = false, fg = "#A8ADB9" }],
  [{ token = "$ihs_tab", fg = "#A8ADB9", dim = false }],
  [
    { token = "$ihs_logo", fg = "#A8ADB9", dim = false },
    { token = "$ihs_working", fg = "#A8ADB9", dim = false },
    { token = "$ihs_blocked", fg = "#F08080", dim = false },
    { token = "$ihs_done", fg = "#91C788", dim = false },
    { token = "$ihs_idle", fg = "#A8ADB9", dim = false },
    { token = "$ihs_unknown", fg = "#A8ADB9", dim = false },
  ],
  [{ token = "$ihs_gap" }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "$ihs_group", bold = true, dim = false, fg = "#A8ADB9" }],
  [{ token = "$ihs_tab", fg = "#A8ADB9", dim = false }],
  [
    { token = "$ihs_logo", fg = "#E68A67", dim = false },
    { token = "$ihs_working", fg = "#E68A67", dim = false },
    { token = "$ihs_blocked", fg = "#F08080", dim = false },
    { token = "$ihs_done", fg = "#91C788", dim = false },
    { token = "$ihs_idle", fg = "#A8ADB9", dim = false },
    { token = "$ihs_unknown", fg = "#A8ADB9", dim = false },
  ],
  [{ token = "$ihs_gap" }],
]
codex = [
  [{ token = "$ihs_group", bold = true, dim = false, fg = "#A8ADB9" }],
  [{ token = "$ihs_tab", fg = "#A8ADB9", dim = false }],
  [
    { token = "$ihs_logo", fg = "#A78BFA", dim = false },
    { token = "$ihs_working", fg = "#A78BFA", dim = false },
    { token = "$ihs_blocked", fg = "#F08080", dim = false },
    { token = "$ihs_done", fg = "#91C788", dim = false },
    { token = "$ihs_idle", fg = "#A8ADB9", dim = false },
    { token = "$ihs_unknown", fg = "#A8ADB9", dim = false },
  ],
  [{ token = "$ihs_gap" }],
]
