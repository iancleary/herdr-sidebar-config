# Repo -> branch -> agent logo, separator, status, and tab title.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [{ token = "$ihs_repo", bold = true, dim = false, fg = "#A8ADB9" }],
  [{ token = "$ihs_row_branch", fg = "#A8ADB9", dim = true }],
  [
    { token = "$ihs_row_logo", fg = "#A8ADB9", dim = false },
    { token = "state_icon" },
    { token = "$ihs_row_tab", fg = "#A8ADB9", dim = false },
  ],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "$ihs_repo", bold = true, dim = false, fg = "#A8ADB9" }],
  [{ token = "$ihs_row_branch", fg = "#A8ADB9", dim = true }],
  [
    { token = "$ihs_row_logo", fg = "#E68A67", dim = false },
    { token = "state_icon" },
    { token = "$ihs_row_tab", fg = "#A8ADB9", dim = false },
  ],
]
codex = [
  [{ token = "$ihs_repo", bold = true, dim = false, fg = "#A8ADB9" }],
  [{ token = "$ihs_row_branch", fg = "#A8ADB9", dim = true }],
  [
    { token = "$ihs_row_logo", fg = "#A78BFA", dim = false },
    { token = "state_icon" },
    { token = "$ihs_row_tab", fg = "#A8ADB9", dim = false },
  ],
]
